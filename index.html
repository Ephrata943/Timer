<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Scroll List Timer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="timer-container">
        <h1>Set & Count Timer</h1>

        <div id="timerDisplay">00:05:00</div>

        <div class="timer-setter" id="pickerContainer">
            <div class="time-column">
                <button class="adjust-btn" id="incHours">+</button>
                <select id="hoursInput"></select>
                <button class="adjust-btn" id="decHours">-</button>
                <div class="label">HRS</div>
            </div>

            <div class="colon">:</div>

            <div class="time-column">
                <button class="adjust-btn" id="incMinutes">+</button>
                <select id="minutesInput"></select>
                <button class="adjust-btn" id="decMinutes">-</button>
                <div class="label">MIN</div>
            </div>

            <div class="colon">:</div>

            <div class="time-column">
                <button class="adjust-btn" id="incSeconds">+</button>
                <select id="secondsInput"></select>
                <button class="adjust-btn" id="decSeconds">-</button>
                <div class="label">SEC</div>
            </div>
        </div>

        <div class="control-buttons">
            <button id="startBtn">Start</button>
            <button id="stopBtn">Stop</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
